name: Umami Browser Probe Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/umami-browser-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Probe with real Chromium context
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          SLUG = "OdDeX9fVWUSAZWw6"
          SHARE_URL = f"https://cloud.umami.is/share/{SLUG}"

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          opts.add_argument('--lang=en-US')

          driver = webdriver.Chrome(options=opts)
          try:
              driver.get(SHARE_URL)
              WebDriverWait(driver, 30).until(lambda d: d.execute_script('return document.readyState') == 'complete')
              time.sleep(5)
              print('PAGE_URL', driver.current_url)
              print('PAGE_TITLE', driver.title)
              text = driver.find_element('tag name', 'body').text
              print('BODY_HEAD', text[:2000].replace('\n', ' | '))

              js = r'''
              const done = arguments[arguments.length - 1];
              (async () => {
                const slug = arguments[0];
                const candidates = ['/analytics/eu', '/analytics/us', ''];
                const attempts = [];
                let resolved = null;
                for (const base of candidates) {
                  const url = `${base}/api/share/${encodeURIComponent(slug)}`;
                  try {
                    const r = await fetch(url, {headers:{accept:'application/json'}});
                    const body = await r.text();
                    attempts.push({base, status:r.status, ctype:r.headers.get('content-type'), body:body.slice(0,500)});
                    if (r.ok) {
                      const data = JSON.parse(body);
                      if (data.token) { resolved = {base, data}; break; }
                    }
                  } catch (e) {
                    attempts.push({base, status:-1, error:String(e)});
                  }
                }
                if (!resolved) return done({ok:false, attempts});
                const {base, data} = resolved;
                const websiteId = data.websiteId || data.entityId;
                const headers = {
                  accept:'application/json',
                  'x-umami-share-token':data.token,
                  'x-umami-share-context':'1'
                };
                const endAt = Date.now();
                const startAt = endAt - 7*24*60*60*1000;
                async function get(path) {
                  const r = await fetch(`${base}${path}`, {headers});
                  const txt = await r.text();
                  let body;
                  try { body = JSON.parse(txt); } catch { body = txt.slice(0,1000); }
                  return {status:r.status, body};
                }
                const out = {
                  ok:true,
                  attempts,
                  base,
                  websiteId,
                  shareKeys:Object.keys(data).filter(k => k !== 'token'),
                  stats24h: await get(`/api/websites/${websiteId}/stats?startAt=${endAt-24*60*60*1000}&endAt=${endAt}`),
                  stats7d: await get(`/api/websites/${websiteId}/stats?startAt=${startAt}&endAt=${endAt}`),
                  metrics:{},
                  eventStats: await get(`/api/websites/${websiteId}/events/stats?startAt=${startAt}&endAt=${endAt}`),
                  playEvents: await get(`/api/websites/${websiteId}/events?startAt=${startAt}&endAt=${endAt}&page=1&pageSize=50&search=google-play-click`)
                };
                for (const type of ['path','entry','exit','referrer','channel','country','region','city','browser','os','device','event']) {
                  out.metrics[type] = await get(`/api/websites/${websiteId}/metrics?startAt=${startAt}&endAt=${endAt}&type=${type}&limit=50&offset=0`);
                }
                done(out);
              })().catch(e => done({ok:false, fatal:String(e), stack:e?.stack}));
              '''
              result = driver.execute_async_script(js, SLUG)
              print('BROWSER_API_RESULT')
              print(json.dumps(result, ensure_ascii=False, indent=2)[:30000])
              if not result.get('ok'):
                  raise SystemExit('BROWSER_PROBE_FAIL')
              print('BROWSER_PROBE_PASS')
          finally:
              driver.quit()
          PY

      - name: Remove one-shot browser probe workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/umami-browser-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove one-shot Umami browser probe"
          git push origin main
